[project]
name = "agentic-autonomous-driving-sim-analyst"
version = "0.1.0"
description = "Agentic analysis of autonomous driving simulation traces."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
