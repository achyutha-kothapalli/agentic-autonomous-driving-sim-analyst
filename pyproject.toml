[project]
name = "agentic-autonomous-driving-sim-analyst"
version = "0.1.0"
description = "Agentic analysis of autonomous driving simulation traces."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
ai = [
    "boto3>=1.35.0",
    "openai>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
